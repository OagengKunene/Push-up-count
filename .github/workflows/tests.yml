name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 libgl1 libglib2.0-0
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Run regression tests
        run: python -m pytest -q
      - name: Synthetic demo smoke test
        run: python app.py --demo --headless --demo-seconds 6 --no-log
      - name: Verify model and run actual pose inference
        run: python scripts/smoke_model.py
      - name: Calibration and history smoke test
        run: python scripts/smoke_v2.py
      - name: Native desktop and speech check
        if: runner.os == 'Windows'
        run: |
          python desktop.py --desktop-smoke
          python app.py --check-voice

  dashboard:
    name: Dashboard browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install -e . playwright
          python -m playwright install --with-deps chromium
      - name: Check dashboard interactions and layout
        run: python scripts/smoke_dashboard.py
      - name: Save dashboard previews
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: verification/dashboard*.png

  windows-app:
    name: Build and verify Windows app
    needs: [test, dashboard]
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Build standalone app with offline model
        run: python scripts/build_windows.py
      - name: Exercise the packaged executable
        run: python scripts/smoke_windows_bundle.py
      - name: Retrieve dashboard preview
        uses: actions/download-artifact@v4
        with:
          name: dashboard-preview
          path: dist/dashboard-preview
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: PushUpCounter-Windows
          path: |
            dist/PushUpCounter-*-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/BUNDLE_VALIDATION.json
          retention-days: 90
      - name: Publish verified Windows download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = python -c "from pushup_counter import __version__; print(__version__)"
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; leaving that published release unchanged."
            exit 0
          }
          gh release create $tag "dist/PushUpCounter-$version-windows-x64.zip" "dist/SHA256SUMS.txt" "dist/BUNDLE_VALIDATION.json" "dist/dashboard-preview/dashboard.png" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "PushUpCounter $version for Windows" --notes-file docs/RELEASE_NOTES.md
